<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>

    <!-- Gold Gradient for 'B' -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe28a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa7c11"/>
    </linearGradient>

    <!-- Metallic Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Dark Circle Container with Gold Ring -->
  <circle cx="100" cy="100" r="92" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="5"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="rgba(212,175,55,0.25)" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Stylized Letter 'B' with Dynamic Wings / Motion Lines -->
  <g transform="translate(10, 0)" filter="url(#glow)">
    <!-- Vertical Spine of 'B' representing Highway Road / Flight -->
    <path d="M 52,42 L 52,158 C 52,158 64,158 72,158 C 82,158 84,142 84,100 C 84,58 82,42 72,42 Z" fill="url(#goldGrad)"/>

    <!-- Top Loop of 'B' -->
    <path d="M 70,42 C 105,42 128,52 128,74 C 128,94 105,100 70,100 L 70,82 C 92,82 108,79 108,74 C 108,68 92,59 70,59 Z" fill="url(#goldGrad)"/>

    <!-- Bottom Loop of 'B' -->
    <path d="M 70,96 C 112,96 138,105 138,128 C 138,152 112,158 70,158 L 70,140 C 98,140 118,136 118,128 C 118,119 98,113 70,113 Z" fill="url(#goldGrad)"/>

    <!-- Central Motion Swoosh / Star Accent -->
    <path d="M 40,100 Q 100,60 160,88 Q 100,80 40,100 Z" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Crown Stars / Quality Guarantee -->
  <path d="M 100,24 L 102.5,29 L 108,29.5 L 104,33 L 105,38.5 L 100,35.5 L 95,38.5 L 96,33 L 92,29.5 L 97.5,29 Z" fill="url(#goldGrad)"/>
</svg>
